# A release published on GitHub gets its download here: it is built from the source of its tag and attached to it.
# Run by hand (Actions → Release → Run workflow) it only builds it, as an artifact to try out.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# nothing by default; the job that attaches the downloads gets write access to the releases only
permissions: {}

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build the extension
        shell: pwsh
        run: ./release.ps1

      - name: Checksums
        shell: pwsh
        run: Get-ChildItem build/dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content build/dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HeMiTube
          path: build/dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:TAG" build/dist/HeMiTube.zip build/dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
